openapi: 3.0.3
info:
  title: AI Japanese Speaking Service API
  version: 1.0.0
  description: |
    AI 일본어 Speaking 서비스의 OpenAPI 명세입니다.
    2026-11-03 B2C 전환을 반영했습니다: 구글·카카오 소셜 로그인만 두고 이메일·비밀번호 가입과 로그인, 기관·Manager·Admin API를 없앴습니다
    (docs/decisions.md 2026-11-03 "소셜 로그인", docs/specs/account.md). 이전 B2B2C 계약은 태그 v1.0-b2b2c에 있습니다.
    질문 수, 점수 산식, 페이징, JWT 갱신, 생성 실패 재시도 방식은 추후 확정 대상입니다.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Speaking
  - name: Conversations
  - name: Interviews
  - name: History
security:
  - bearerAuth: []
paths:
  /api/auth/oauth/{provider}:
    post:
      tags: [Auth]
      summary: 소셜 로그인 (가입 겸 로그인)
      description: |
        구글·카카오 로그인 후 Frontend로 돌아온 일회용 인가 코드(authorization code)를 받아,
        Backend가 제공자와 코드를 교환하고 사용자 정보를 확인한 뒤 로그인 토큰을 JSON으로 돌려준다
        (decisions.md 2026-11-03 "소셜 로그인 후 토큰 전달 방식").
        - (provider, 제공자 고유 ID)로 가입한 계정이 있으면 로그인한다.
        - 없으면 새 계정을 만든다(role LEARNER, status ACTIVE). 이름·이메일은 가입 때 값으로 고정한다.
        - 이메일이 없거나 인증되지 않았으면 가입을 막는다(403 EMAIL_NOT_VERIFIED).
        - 같은 이메일로 다른 제공자 계정이 있으면 가입을 막는다(409 EMAIL_ALREADY_REGISTERED).
        흐름과 테스트케이스는 docs/specs/account.md.
      security: []
      operationId: oauthLogin
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: 로그인 성공. 처음 온 사용자면 계정을 만들고 newUser가 true다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 인가 코드가 없거나 제공자와의 코드 교환에 실패함 (INVALID_AUTHORIZATION_CODE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 이메일이 없거나 인증되지 않아 가입할 수 없음 (EMAIL_NOT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 같은 이메일로 다른 제공자 계정이 이미 있음 (EMAIL_ALREADY_REGISTERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAlreadyRegisteredError'
        '502':
          description: 제공자(구글·카카오) 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인 사용자와 권한 조회
      operationId: getAuthMe
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # NOTE: /api/users/me(GET), /api/users/me/preferences는 아직 백엔드에 구현되어 있지 않아 문서에 두지 않는다
  # (이슈 #3). 로그인 사용자 정보는 /api/auth/me로 조회한다. 비밀번호 변경 API는 소셜 로그인 전환으로 없앴다.
  /api/users/me:
    delete:
      tags: [Users]
      summary: 회원 탈퇴
      description: |
        현재 사용자의 계정과 학습 기록(Speaking 세션, 메시지, 피드백, 설정)을 모두 삭제한다.
        삭제 전에 제공자 연결을 끊는다(카카오 연결 끊기, 구글 권한 철회). 연결 끊기가 실패해도
        우리 쪽 데이터는 삭제하고 탈퇴를 끝낸다(decisions.md 2026-11-03). 같은 소셜 계정으로 다시 가입하면 새 계정이 된다.
      operationId: deleteMe
      responses:
        '204':
          description: 탈퇴 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/speaking/sessions/{sessionId}:
    get:
      tags: [Speaking]
      summary: 내 Speaking 세션 공통 정보 조회
      description: 로그인 사용자 소유 세션만 조회할 수 있습니다.
      operationId: getSpeakingSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 세션 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakingSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/conversations:
    post:
      tags: [Conversations]
      summary: 일반회화 시작
      description: JWT 사용자로 Speaking 세션과 시작 당시 설정을 함께 생성합니다.
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationStartRequest'
      responses:
        '201':
          description: 일반회화 시작됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeakingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/conversations/{sessionId}/opening:
    post:
      tags: [Conversations]
      summary: AI 선발화 (대화 시작 시 AI가 먼저 말하기)
      description: |
        일반 회화 세션의 AI 첫 발화를 만든다. 이미 선발화가 있으면 새로 만들지 않고 기존 글을 재사용해
        같은 응답 형태(TTS·자막 포함)로 다시 돌려준다. 사용자 발화가 이미 있으면 선발화를 새로 만들지 않는다.
        (코드: ConversationController.opening, ConversationService.openConversation)
      operationId: createConversationOpening
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: AI 선발화 메시지와 음성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOpeningResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: LLM/TTS 처리 중 AI 서비스 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/conversations/{sessionId}/turns:
    post:
      tags: [Conversations]
      summary: 사용자 발화 제출 및 AI 응답 생성
      operationId: createConversationTurn
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationTurnRequest'
      responses:
        '200':
          description: 저장된 사용자·AI 메시지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationTurnResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/conversations/{sessionId}/turns/audio:
    post:
      tags: [Conversations]
      summary: 음성 발화 제출 (STT → AI 응답 생성 → TTS)
      description: |
        브라우저 MediaRecorder로 녹음한 오디오 파일을 받아 STT → Conversation LLM → TTS까지
        한 번에 처리하는 음성 전용 turn 엔드포인트다. 문서화된 JSON 기반 /turns 계약과는
        별개의 응답 형태이며, 실제 음성 E2E에서 Frontend가 사용하는 엔드포인트다.
      operationId: createConversationAudioTurn
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 사용자 발화 녹음 파일 (webm/mp4/wav/mp3/ogg)
      responses:
        '200':
          description: 저장된 사용자·AI 메시지와 AI 음성 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationAudioTurnResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: STT/LLM/TTS 처리 중 AI 서비스 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/conversations/{sessionId}/complete:
    post:
      tags: [Conversations]
      summary: 일반회화 정상 종료 및 피드백 생성
      operationId: completeConversation
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 종료 및 피드백 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCompletionResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/conversations/{sessionId}/abort:
    post:
      tags: [Conversations]
      summary: 일반회화 중도 종료
      operationId: abortConversation
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 중도 종료됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCompletionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/conversations/{sessionId}/feedback:
    get:
      tags: [Conversations]
      summary: 일반회화 피드백 조회
      operationId: getConversationFeedback
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 일반회화 피드백
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFeedback'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/interviews:
    post:
      tags: [Interviews]
      summary: 면접 시작 및 첫 질문 생성
      description: 대상 국가·언어·피드백 언어는 서버가 JAPAN/JAPANESE/KOREAN으로 지정합니다.
      operationId: startInterview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewStartRequest'
      responses:
        '201':
          description: 면접 시작됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/interviews/{sessionId}/questions/{questionId}/answer:
    post:
      tags: [Interviews]
      summary: 텍스트 확정 답변 제출, 평가, Coaching 및 다음 질문 결정
      description: 답변 평가와 Coaching 후 Backend 진행 제한에 따라 Follow-up, 다음 INITIAL 또는 완료를 결정합니다.
      operationId: submitInterviewAnswer
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewAnswerRequest'
      responses:
        '200':
          description: 답변·평가·Coaching 저장 및 다음 질문 결정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewAnswerResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: 답변 평가 AI 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/interviews/{sessionId}/questions/{questionId}/answer/audio:
    post:
      tags: [Interviews]
      summary: 음성 확정 답변 제출, 평가, Coaching 및 다음 질문 결정
      description: 브라우저 MediaRecorder 오디오를 STT한 뒤 답변·평가·Coaching·진행을 하나의 성공 단위로 저장합니다.
      operationId: submitInterviewAudioAnswer
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 사용자 면접 답변 녹음 파일 (webm/mp4/wav/mp3/ogg)
      responses:
        '200':
          description: STT 답변·평가·Coaching 저장 및 다음 질문 결정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewAnswerResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: STT 또는 답변 평가 AI 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/interviews/{sessionId}/complete:
    post:
      tags: [Interviews]
      summary: 면접 정상 종료 및 전체 종합평가 생성
      description: |
        미답변 질문이 남아 있으면 완료할 수 없습니다. 종료와 종합평가 생성을 하나의 성공 단위로
        처리하므로, 종합평가 AI 생성이나 저장이 실패하면 세션도 COMPLETED로 남지 않습니다.
      operationId: completeInterview
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 종료 및 종합평가 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCompletionResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: 종합평가 AI 처리 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/interviews/{sessionId}/abort:
    post:
      tags: [Interviews]
      summary: 면접 중도 종료
      operationId: abortInterview
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 중도 종료됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCompletionResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/interviews/{sessionId}/feedback:
    get:
      tags: [Interviews]
      summary: 면접 전체 및 답변별 피드백 조회
      operationId: getInterviewFeedback
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 면접 피드백
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewFeedback'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/history:
    get:
      tags: [History]
      summary: 내 학습 기록 목록
      description: |
        로그인한 LEARNER 본인의 COMPLETED 세션(일반회화 + 면접)만 startedAt 내림차순으로
        반환합니다. 유형별 필터(전체/일반 회화/면접 회화)는 Frontend에서 이 목록을 대상으로
        클라이언트 사이드로 처리합니다. AI를 호출하지 않고 저장된 데이터만 조회합니다.
      operationId: getMyHistory
      responses:
        '200':
          description: 학습 기록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryItem'
  /api/history/{sessionId}:
    get:
      tags: [History]
      summary: 내 학습 기록 상세
      description: |
        sessionType에 따라 설정(settings)·Transcript·해당 모드 피드백을 조합합니다.
        본인 소유의 세션이 아니면 403, 존재하지 않으면 404를 반환합니다.
        conversationFeedback/interviewFeedback은 sessionType에 맞는 쪽만 채워지고
        나머지는 null입니다. AI를 다시 호출하지 않고 저장된 데이터만 조회합니다.
      operationId: getMyHistoryDetail
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 모드별 학습 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증되지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 접근 권한 또는 소유권이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 현재 상태에서 처리할 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserRole:
      type: string
      enum: [LEARNER]
      description: B2C 전환으로 LEARNER 하나만 쓴다(decisions.md 2026-11-03 "사용자 역할")
    UserStatus:
      type: string
      enum: [ACTIVE]
      description: 가입 승인이 없어져 ACTIVE 하나만 쓴다
    OAuthProvider:
      type: string
      enum: [google, kakao]
    SessionType:
      type: string
      enum: [CONVERSATION, INTERVIEW]
    SessionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABORTED]
    GenerationStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]
    Difficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    SubtitleMode:
      type: string
      enum: [OFF, JAPANESE, JAPANESE_KOREAN]
    QuestionKind:
      type: string
      enum: [INITIAL, FOLLOW_UP]
    QuestionStatus:
      type: string
      enum: [SUGGESTED, ASKED, ANSWERED, SKIPPED]
    OAuthLoginRequest:
      type: object
      required: [code, redirectUri]
      properties:
        code:
          type: string
          description: 제공자가 Frontend로 돌려준 일회용 인가 코드
        redirectUri:
          type: string
          description: 인가 요청에 쓴 redirect URI. 제공자와 코드 교환할 때 같은 값이어야 한다
    LoginResponse:
      type: object
      required: [accessToken, user, newUser]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
        newUser:
          type: boolean
          description: 이번 요청으로 계정이 새로 만들어졌으면 true (튜토리얼 표시 판단에 쓴다)
    User:
      type: object
      required: [id, name, email, provider, role, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        provider:
          $ref: '#/components/schemas/OAuthProvider'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    UserPreferences:
      type: object
      required: [defaultDifficulty, defaultSubtitleMode]
      properties:
        defaultDifficulty:
          $ref: '#/components/schemas/Difficulty'
        defaultSubtitleMode:
          $ref: '#/components/schemas/SubtitleMode'
        message:
          type: string
    SpeakingSession:
      type: object
      required: [sessionId, sessionType, status, startedAt]
      properties:
        sessionId:
          type: integer
          format: int64
        sessionType:
          $ref: '#/components/schemas/SessionType'
        status:
          $ref: '#/components/schemas/SessionStatus'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          minimum: 0
    SessionCompletionResponse:
      type: object
      required: [sessionId, status]
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
        feedbackGenerationStatus:
          allOf:
            - $ref: '#/components/schemas/GenerationStatus'
          nullable: true
          description: abort 응답에서는 null일 수 있음
    ConversationStartRequest:
      type: object
      required: [difficulty, subtitleMode]
      properties:
        situation:
          type: string
          maxLength: 100
        partnerRole:
          type: string
          maxLength: 100
        partnerPersonality:
          type: string
          maxLength: 100
        situationDescription:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        subtitleMode:
          $ref: '#/components/schemas/SubtitleMode'
    ConversationTurnRequest:
      type: object
      required: [userMessage]
      properties:
        userMessage:
          type: string
          minLength: 1
    Message:
      type: object
      required: [messageId, content]
      properties:
        messageId:
          type: integer
          format: int64
        content:
          type: string
    TranscriptMessage:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [sequenceNo, speaker, messageType, createdAt]
          properties:
            sequenceNo:
              type: integer
            speaker:
              type: string
              enum: [USER, AI]
            messageType:
              type: string
              example: CONVERSATION
            createdAt:
              type: string
              format: date-time
    ConversationTurnResponse:
      type: object
      required: [userMessage, aiMessage]
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        aiMessage:
          $ref: '#/components/schemas/Message'
    ConversationAudioTurnResponse:
      type: object
      required: [userMessage, aiMessage, aiAudioBase64, aiAudioMimeType]
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        aiMessage:
          $ref: '#/components/schemas/Message'
        aiMessageKoreanSubtitle:
          type: string
          nullable: true
          description: subtitleMode가 JAPANESE_KOREAN일 때만 값이 채워짐
        aiAudioBase64:
          type: string
          description: AI 응답 음성(TTS 결과)을 Base64로 인코딩한 값
        aiAudioMimeType:
          type: string
          example: audio/mpeg
    ConversationCorrection:
      type: object
      required: [category, originalExpression, suggestedExpression]
      properties:
        messageId:
          type: integer
          format: int64
          nullable: true
        category:
          type: string
          enum: [GRAMMAR, VOCABULARY, NATURALNESS, EXPRESSION]
        originalExpression:
          type: string
        suggestedExpression:
          type: string
        reading:
          type: string
          description: suggestedExpression을 히라가나 중심으로 읽은 표기
        koreanTranslation:
          type: string
          description: suggestedExpression의 자연스러운 한국어 번역
        explanation:
          type: string
        displayOrder:
          type: integer
    ConversationFeedback:
      type: object
      required: [sessionId, generationStatus, corrections]
      properties:
        sessionId:
          type: integer
          format: int64
        generationStatus:
          $ref: '#/components/schemas/GenerationStatus'
        summary:
          type: string
        naturalnessComment:
          type: string
        grammarComment:
          type: string
        vocabularyComment:
          type: string
        strengths:
          type: array
          items:
            type: string
        nextTip:
          type: string
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/ConversationCorrection'
    InterviewStartRequest:
      type: object
      required: [jobRole, difficulty, subtitleMode]
      properties:
        jobRole:
          type: string
          maxLength: 100
        interviewType:
          type: string
          maxLength: 50
          example: TECHNICAL
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        additionalRequest:
          type: string
        subtitleMode:
          $ref: '#/components/schemas/SubtitleMode'
    InterviewQuestion:
      type: object
      required: [questionId, questionKind, questionText, sequenceNo]
      properties:
        questionId:
          type: integer
          format: int64
        questionKind:
          $ref: '#/components/schemas/QuestionKind'
        questionText:
          type: string
        sequenceNo:
          type: integer
    InterviewStartResponse:
      type: object
      required: [sessionId, status, firstQuestion]
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        firstQuestion:
          $ref: '#/components/schemas/InterviewQuestion'
    InterviewAnswerRequest:
      type: object
      required: [answerText]
      properties:
        answerText:
          type: string
          minLength: 1
    InterviewAnswerResponse:
      type: object
      required: [answerId, answerText, feedback, isComplete]
      properties:
        answerId:
          type: integer
          format: int64
        answerText:
          type: string
          description: STT 또는 텍스트 요청으로 확정된 사용자 답변
        feedback:
          $ref: '#/components/schemas/InterviewAnswerEvaluation'
        nextQuestion:
          allOf:
            - $ref: '#/components/schemas/InterviewQuestion'
          nullable: true
        isComplete:
          type: boolean
          description: Backend가 허용된 질문 진행을 모두 마쳤으면 true
    EvaluationCriterion:
      type: string
      enum:
        - QUESTION_RELEVANCE
        - LOGICAL_THINKING
        - SPECIFICITY
        - COMMUNICATION
        - BUSINESS_JAPANESE
        - STAR_STRUCTURE
    EvaluationScore:
      type: object
      required: [criterion, applicable]
      properties:
        criterion:
          $ref: '#/components/schemas/EvaluationCriterion'
        score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
        feedback:
          type: string
        applicable:
          type: boolean
          description: false이면 score는 null
    InterviewAnswerEvaluation:
      type: object
      required:
        - overallScore
        - evaluationSummary
        - scores
        - strengths
        - weaknesses
        - coachingSummary
        - improvementTips
        - modelAnswer
        - rubricVersion
        - generationStatus
        - starRecommended
      properties:
        overallScore:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: applicable=true인 criterion 점수의 단순 산술 평균
        evaluationSummary:
          type: string
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationScore'
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        coachingSummary:
          type: string
          description: 기존 평가를 반복하지 않는 답변 개선 방향
        improvementTips:
          type: array
          items:
            type: string
        modelAnswer:
          type: string
          description: 사용자 답변의 사실 범위 안에서 개선한 일본어 답변. DB improved_answer에 저장됩니다.
        rubricVersion:
          type: string
        generationStatus:
          $ref: '#/components/schemas/GenerationStatus'
        starRecommended:
          type: boolean
    InterviewAnswerFeedback:
      type: object
      required: [question, answer, scores, generationStatus]
      properties:
        question:
          type: string
        answer:
          type: string
        overallScore:
          type: number
          format: double
          nullable: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationScore'
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        coachingSummary:
          type: string
        improvementTips:
          type: array
          items:
            type: string
        improvedAnswer:
          type: string
        rubricVersion:
          type: string
        generationStatus:
          $ref: '#/components/schemas/GenerationStatus'
    InterviewOverallFeedback:
      type: object
      properties:
        overallScore:
          type: number
          format: double
          nullable: true
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        evaluatedAnswerCount:
          type: integer
        rubricVersion:
          type: string
        generationStatus:
          $ref: '#/components/schemas/GenerationStatus'
    InterviewFeedback:
      type: object
      required: [sessionId, overall, answers]
      properties:
        sessionId:
          type: integer
          format: int64
        overall:
          $ref: '#/components/schemas/InterviewOverallFeedback'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/InterviewAnswerFeedback'
    HistoryItem:
      type: object
      required: [sessionId, sessionType, status, title, startedAt]
      properties:
        sessionId:
          type: integer
          format: int64
        sessionType:
          $ref: '#/components/schemas/SessionType'
        status:
          $ref: '#/components/schemas/SessionStatus'
        title:
          type: string
        startedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          nullable: true
        overallScore:
          type: number
          format: double
          nullable: true
          description: 일반회화는 null
    HistoryDetail:
      type: object
      required: [sessionId, sessionType, status, startedAt, transcript]
      properties:
        sessionId:
          type: integer
          format: int64
        sessionType:
          $ref: '#/components/schemas/SessionType'
        status:
          $ref: '#/components/schemas/SessionStatus'
        startedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          nullable: true
        settings:
          type: object
          additionalProperties: true
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptMessage'
        conversationFeedback:
          allOf:
            - $ref: '#/components/schemas/ConversationFeedback'
          nullable: true
        interviewFeedback:
          allOf:
            - $ref: '#/components/schemas/InterviewFeedback'
          nullable: true
    ConversationOpeningResponse:
      type: object
      required: [aiMessage, aiAudioBase64, aiAudioMimeType]
      properties:
        aiMessage:
          $ref: '#/components/schemas/Message'
        aiMessageKoreanSubtitle:
          type: string
          nullable: true
          description: subtitleMode가 JAPANESE_KOREAN일 때만 값이 채워짐
        aiAudioBase64:
          type: string
          description: AI 선발화 음성(TTS 결과)을 Base64로 인코딩한 값
        aiAudioMimeType:
          type: string
          example: audio/mpeg
    EmailAlreadyRegisteredError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [registeredProvider]
          properties:
            registeredProvider:
              $ref: '#/components/schemas/OAuthProvider'
              description: 이 이메일로 이미 가입된 제공자. 화면에 "이미 카카오로 가입된 이메일입니다"처럼 안내한다
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
